project:
  type: book
  output-dir: .   # render in place, so the HTML sits next to each .qmd and GitHub Pages serves it as is

book:
  title: "Real Analysis"
  search: true
  page-navigation: true
  chapters:
    - index.qmd
    - Sets/sets.qmd
    - Real-Numbers/real-numbers.qmd
    - Sequences-Series/sequences-series.qmd
    - Continuous-Functions/continuous-functions.qmd
  sidebar:
    style: docked
  page-footer:
    left: "[Thomas' homepage](https://thomaslylyll.github.io/)"

format:
  html:
    theme: [litera, styles.scss]
    toc: true

filters:
  - linebreaks.lua
  - at: post-render
    path: numbering.lua

crossref:
  chapters: true   # results numbered by chapter, e.g. 3.2; numbering.lua makes all kinds share one counter
